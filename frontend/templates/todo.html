<!DOCTYPE html>
<html>
<head>
    <title>To-Do Page</title>
</head>
<body>
    <h2>Add To-Do Item</h2>

    <form action="http://localhost:9000/submittodoitem" method="POST">
        <input type="text" name="itemName" placeholder="Item Name" required><br>
        <input type="text" name="itemId" placeholder="Item ID"><br>
        <input type="text" name="itemDescription" placeholder="Item Description" required><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
